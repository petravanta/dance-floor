<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dance Floor</title>
<meta name="description" content="A friendly primer on basic dance-floor moves for goth, industrial and rave nights, with a beat to count along to.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#172129" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem('petravanta.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ===== Shared look: petravanta's apps =====
   Canonical copy of the tokens, type and components used by Fitness Coach and Skating Mentor (and this hub).
   Apps currently inline this block between "Shared look" and "end shared look"; update both when it changes.
   Each app only overrides the --accent values after this block. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --sunk:#e3e9ec; --line:#cdd6db; --ink:#14212a; --muted:#566771; --faint:#8a99a2;
  --lv-new:#9aa8b0; --lv-learn:#c07a00; --lv-dev:#2f6fd0; --lv-conf:#11897a; --lv-solid:#0c5e3e;
  --lv-learn-bg:#fbefd9; --lv-dev-bg:#e1ebfa; --lv-conf-bg:#d9f1ec; --lv-solid-bg:#d5eadf;
  --danger:#b3261e; --danger-soft:#fbe3e1;
  --f-display:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;padding-block:12px 0;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px;flex:none}
.save-state{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 80px}
h2{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.big{padding:12px 22px;font-size:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;min-width:0}
textarea{resize:vertical}
.ctx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
@media (max-width:720px){.ctx{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ctx-note{font-size:13px;color:var(--muted);margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.l1{background:var(--lv-learn-bg);color:var(--lv-learn)}
.pill.l2{background:var(--lv-dev-bg);color:var(--lv-dev)}
.pill.l3{background:var(--lv-conf-bg);color:var(--lv-conf)}
.pill.l4{background:var(--lv-solid-bg);color:var(--lv-solid)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:720px){.two{grid-template-columns:minmax(0,1fr)}}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{flex:1 1 260px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.35);z-index:40}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 18px;display:flex;flex-direction:column;gap:16px}
@media (max-width:640px){.drawer{top:auto;left:0;width:100%;max-height:86vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px))}}
.drawer .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));background:var(--sunk);border:0;border-radius:999px;width:32px;height:32px;font-size:18px;line-height:1}
@media (max-width:640px){.drawer .x{top:12px}}
.drawer h2{padding-right:40px}
.drawer ul,.cues{margin:0;padding-left:18px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--sunk)}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line)}
.entry .meta{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.4}}}
/* ===== end shared look ===== */
/* Dance Floor accent: fuchsia */
:root{--accent:#a21caf;--accent-ink:#ffffff;--accent-soft:#f7e4f9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#e879f9;--accent-ink:#2b0530;--accent-soft:#33173a}}
:root[data-theme="dark"]{--accent:#e879f9;--accent-ink:#2b0530;--accent-soft:#33173a}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main{padding-bottom:8px}
/* The version line sits under main and keeps clear of the docked beat */
[data-version-footer]{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 156px)!important}
.intro h2{margin-bottom:6px}
.intro .genres{margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.move{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;color:inherit}
.move:hover{border-color:var(--accent)}
.move h4{margin:0;font-size:17px;font-weight:700}
.move .counts{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.move p{color:var(--muted);font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.pill.d1{background:var(--lv-conf-bg);color:var(--lv-conf)}
.pill.d2{background:var(--lv-dev-bg);color:var(--lv-dev)}
.pill.d3{background:var(--lv-learn-bg);color:var(--lv-learn)}
.pill.style{background:var(--accent-soft);color:var(--accent)}
section.group{display:flex;flex-direction:column;gap:12px}
section.group h3{margin-top:8px}
.drawer ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.drawer ul{display:flex;flex-direction:column;gap:4px}
.drawer .why{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:14px}
.drawer .counts{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.drawer .links{display:flex;gap:6px;flex-wrap:wrap}
.drawer section{display:flex;flex-direction:column;gap:8px}
/* Count-along beat, docked at the bottom */
.beat{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(16px,env(safe-area-inset-left,0px))}
.beat .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0}
.beat .play{width:44px;height:44px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-size:18px;flex:none}
.dots{display:flex;gap:8px}
.dots i{width:14px;height:14px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);transition:transform .06s}
.dots i.on{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.dots i.half{opacity:.35}
.bpm{display:flex;align-items:center;gap:6px}
.bpm output{font-family:var(--f-mono);min-width:3.5ch;text-align:right;font-size:16px}
.bpm input{width:min(180px,32vw);accent-color:var(--accent)}
.beat label.half-time{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.beat select.sound{font:inherit;font-size:13px;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.beat .what{font-size:13px;color:var(--muted);flex:1 1 160px;min-width:0}
@media (max-width:560px){.beat .what{order:9;flex-basis:100%}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* Stick-figure animation in the move drawer */
.dancer{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:4px 12px;background:var(--sunk);border-radius:var(--r);padding:10px 14px 12px}
.dancer svg{grid-column:1/-1;width:100%;height:200px;display:block;overflow:visible}
.figure .fig{stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.figure .fig.far{opacity:.4}
.figure .head{fill:var(--ink);stroke:none}
.figure .face{fill:var(--accent);stroke:none}
.figure .floor{stroke:var(--line);stroke-width:2}
.figure .shadow{fill:var(--line);opacity:.6}
/* Mini preview on each move card */
.move{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:8px;align-content:start}
.move>*{grid-column:1}
.move .mini{grid-column:2;grid-row:1/span 4;align-self:center;width:60px;height:84px;display:block;overflow:visible}
.move .mini .fig{stroke-width:8}
.move .mini .floor{stroke-width:3}
.move:hover .mini .fig,.move:hover .mini .head{stroke:var(--accent)}
.move:hover .mini .head{fill:var(--accent)}
.dancer .count{display:flex;align-items:center;gap:10px;min-width:0}
.dancer .count .dots i{width:10px;height:10px}
.dancer .cue{font-weight:600;color:var(--accent);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dancer .note{grid-column:1/-1;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="topbar">
      <a data-hub-link href="https://petravanta.github.io/general/">All apps</a>
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="12" r="9" fill="var(--accent)"/><path d="M8 12h16M16 3v18M10 6.5c3 2 9 2 12 0M10 17.5c3-2 9-2 12 0" stroke="var(--surface)" stroke-width="1.4" fill="none"/><path d="M16 21v3M9 29l3-4M23 29l-3-4" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/></svg>
        Dance Floor
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Styles"></nav>
  </div>
</header>
<main class="wrap stack" id="main">
  <p class="empty" id="loading">Loading moves…</p>
</main>
<div data-version-footer></div>
<div class="beat" role="region" aria-label="Count-along beat">
  <div class="wrap">
    <button type="button" class="play" id="play" aria-label="Start the beat">▶</button>
    <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="bpm">
      <label class="sr-only" for="bpm">Tempo</label>
      <input type="range" id="bpm" min="60" max="180" step="1" value="120">
      <output id="bpmOut" for="bpm">120</output><span class="small muted">BPM</span>
    </div>
    <label class="half-time"><input type="checkbox" id="half"> Half time</label>
    <label class="sr-only" for="sound">Sound</label>
    <select id="sound" class="sound"><option value="groove">Groove</option><option value="click">Click</option></select>
    <span class="what" id="what">Tap play and bounce on every beat.</span>
  </div>
</div>
<div id="layer"></div>
<script>
'use strict';
/* Dance Floor: a light primer on basic moves for goth, industrial and rave floors.
   Everything it teaches is data: data/styles.json and data/moves.json (schemas in data/schema/).
   Nothing personal is saved. The only things kept in this browser are the last style tab and the beat settings. */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const LEVEL = { 1: 'Easy', 2: 'Medium', 3: 'Tricky' };
const FOCUS = { feet: 'Feet', legs: 'Legs', hips: 'Hips', torso: 'Torso', arms: 'Arms', balance: 'Balance', awareness: 'Floor sense' };

let STYLES = [], MOVES = [], byId = new Map(), styleOf = new Map();
let tab = lsGet('danceFloor.tab') || 'all';

async function loadData() {
  const get = async f => { const r = await fetch(f); if (!r.ok) throw new Error(f + ' ' + r.status); return r.json(); };
  [STYLES, MOVES] = await Promise.all([get('data/styles.json'), get('data/moves.json')]);
  byId = new Map(MOVES.map(m => [m.id, m]));
  styleOf = new Map(STYLES.map(s => [s.id, s]));
}

/* ---------- Tabs and the move list ---------- */
function renderTabs() {
  const items = [{ id: 'all', name: 'All moves' }, ...STYLES];
  if (!items.some(i => i.id === tab)) tab = 'all';
  $('#tabs').innerHTML = items.map(i => `<button type="button" data-tab="${esc(i.id)}" aria-selected="${i.id === tab}">${esc(i.name)}</button>`).join('');
}
function card(m, showStyle) {
  const s = styleOf.get(m.style);
  return `<button type="button" class="move" data-move="${esc(m.id)}">
    <div class="tags"><span class="pill d${m.difficulty}">${LEVEL[m.difficulty]}</span>${showStyle && s ? `<span class="pill style">${esc(s.name)}</span>` : ''}</div>
    <h4>${esc(m.name)}</h4>
    <p>${esc(m.summary)}</p>
    <span class="counts">${esc(m.counts)}</span>
    ${m.animation ? figureSvg('mini', '') : ''}
  </button>`;
}
function renderMain() {
  const main = $('#main');
  if (tab === 'all') {
    main.innerHTML = `<div class="panel intro">
        <h2>Never danced in a club? Start here.</h2>
        <p class="muted">Pick a move, read the cues, then press play at the bottom and try it to the beat. The <b>Easy</b> ones in Floor basics work on any floor, so begin with those and add a style when you're ready.</p>
      </div>` +
      STYLES.map(s => {
        const ms = MOVES.filter(m => m.style === s.id);
        return ms.length ? `<section class="group"><h3>${esc(s.name)}</h3><div class="grid">${ms.map(m => card(m)).join('')}</div></section>` : '';
      }).join('');
  } else {
    const s = styleOf.get(tab), ms = MOVES.filter(m => m.style === tab);
    main.innerHTML = `<div class="panel intro">
        <h2>${esc(s.name)}</h2>
        <p class="muted">${esc(s.description)}</p>
        ${s.why ? `<p class="small" style="margin-top:8px">${esc(s.why)}</p>` : ''}
        <div class="toolbar genres">
          ${(s.music || []).map(g => `<span class="pill">${esc(g)}</span>`).join('')}
          <span class="small muted mono">${s.bpm.min}–${s.bpm.max} BPM</span>
          <button type="button" class="btn sm" data-tempo="${esc(s.id)}">Use ${s.bpm.default} BPM</button>
        </div>
      </div>
      <div class="grid">${ms.map(m => card(m)).join('')}</div>`;
  }
  startMinis();
}
function setTab(id) {
  tab = id; lsSet('danceFloor.tab', id);
  renderTabs(); renderMain();
  const s = styleOf.get(id);
  setStyle(id);
  if (s && !beat.touched) setBpm(s.bpm.default, s.id === 'goth');
}

/* ---------- Move drawer ---------- */
function list(title, items, tag = 'ul') {
  return items && items.length ? `<section><h3>${title}</h3><${tag}>${items.map(t => `<li>${esc(t)}</li>`).join('')}</${tag}></section>` : '';
}
function openMove(id) {
  const m = byId.get(id); if (!m) return;
  const s = styleOf.get(m.style);
  const before = m.buildsOn.map(b => byId.get(b)).filter(Boolean);
  const next = MOVES.filter(x => x.buildsOn.includes(m.id));
  $('#layer').innerHTML = `<div class="scrim" data-close></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
      <button type="button" class="x" data-close aria-label="Close">×</button>
      <div class="stack" style="gap:8px">

  beat.on = true; beat.step = 0; beat.next = beat.ctx.currentTime + 0.06;
  clearInterval(beat.timer); beat.timer = setInterval(tick, 25); tick();
  $('#play').textContent = '■'; $('#play').setAttribute('aria-label', 'Stop the beat'); describeBeat(); syncTry();
}
function stop() {
  beat.on = false; clearInterval(beat.timer);
  $('#play').textContent = '▶'; $('#play').setAttribute('aria-label', 'Start the beat');
  [...$('#dots').children].forEach(d => d.classList.remove('on')); describeBeat(); syncTry();
}
// The drawer's try button doubles as a stop button while an animated move is open
function syncTry() {
  const t = $('[data-try]'); if (t) t.textContent = tryLabel(byId.get(t.dataset.try));
  if (dancer.m && !dancer.playing && beat.on) setDancerPlaying(true);
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-move],[data-close],[data-try],[data-tempo],#play,#dPlay'); if (!t) return;
  if (t.id === 'dPlay') return setDancerPlaying(!dancer.playing);
  if (t.dataset.tab) return setTab(t.dataset.tab);
  if (t.dataset.move) return openMove(t.dataset.move);
  if (t.hasAttribute('data-close')) return closeDrawer();
  if (t.dataset.tempo) { const s = styleOf.get(t.dataset.tempo); beat.touched = true; setStyle(s.id); return setBpm(s.bpm.default, s.id === 'goth'); }
  if (t.dataset.try) {
    const m = byId.get(t.dataset.try), s = styleOf.get(m.style);
    if (m.animation && beat.on) return stop();
    beat.touched = true; setStyle(s.id); setBpm(s.bpm.default, s.id === 'goth');
    if (!m.animation) closeDrawer();  // with a figure to follow, keep the drawer open
    return start();
  }
  if (t.id === 'play') return beat.on ? stop() : start();
});
$('#bpm').addEventListener('input', e => { beat.touched = true; setBpm(+e.target.value); });
$('#half').addEventListener('change', e => { beat.touched = true; setBpm(beat.bpm, e.target.checked); });
$('#sound').addEventListener('change', e => { beat.sound = e.target.value; setBpm(beat.bpm); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#layer').innerHTML) closeDrawer(); });

(async () => {
  setBpm(beat.bpm, beat.half);
  try { await loadData(); } catch (e) { $('#main').innerHTML = '<p class="empty">Couldn’t load the moves. Check your connection and reload.</p>'; return; }
  renderTabs(); renderMain(); setStyle(tab);
  const m = new URLSearchParams(location.search).get('move'); if (m && byId.has(m)) openMove(m);
})();
</script>
